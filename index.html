<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lotto Collector PRO</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; background: #0d1117; color: #e6e6e6; padding: 12px; margin: 0; }
    h2 { margin: 4px 0 10px; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 12px; margin: 8px 0; }
    .btn { display: block; width: 100%; padding: 14px; margin: 8px 0; border-radius: 10px; border: none; font-size: 16px; font-weight: bold; background: #1f6feb; color: #fff; }
    .btn.green { background: #238636; }
    .btn.red { background: #b62324; }
    .btn.gray { background: #30363d; }
    .btn.orange { background: #bb650f; }
    .btn:disabled { opacity: 0.5; }
    .row { display: flex; gap: 8px; }
    .row .btn { flex: 1; }
    .draw { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 10px 12px; margin: 8px 0; }
    .draw.bad { border-color: #b62324; background: #1a0f10; }
    .draw .top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .draw .date { flex: 1; }
    .badge { font-size: 10px; font-weight: bold; padding: 3px 8px; border-radius: 6px; }
    .b-ok { background: #12261a; color: #3fb950; border: 1px solid #1f4d2e; }
    .b-rev { background: #2b1a00; color: #f0b72f; border: 1px solid #5c4a10; }
    .numrow { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; margin: 4px 0; }
    .numrow .lbl { width: 64px; font-size: 11px; color: #8b949e; font-weight: bold; }
    input { background: #0d1117; color: #e6e6e6; border: 1px solid #30363d; border-radius: 8px; padding: 8px; font-size: 15px; }
    input.date { flex: 1; }
    input.n { width: 38px; text-align: center; font-weight: bold; }
    textarea { width: 100%; min-height: 130px; background: #0d1117; color: #e6e6e6; border: 1px solid #30363d; border-radius: 10px; padding: 10px; font-size: 13px; font-family: monospace; }
    .del { background: #b62324; border: none; color: #fff; border-radius: 8px; padding: 8px 10px; font-weight: bold; }
    .err { background: #2d1214; color: #f85149; border: 1px solid #5c2320; padding: 10px; border-radius: 10px; margin: 8px 0; font-size: 12px; word-break: break-all; display: none; }
    .hint { font-size: 12px; color: #8b949e; line-height: 1.5; }
    .summary { font-size: 13px; padding: 10px; border-radius: 10px; background: #12261a; color: #3fb950; border: 1px solid #1f4d2e; margin: 8px 0; }
    .empty { text-align: center; color: #8b949e; padding: 26px 8px; }
    .slots { display: flex; gap: 6px; justify-content: center; margin: 10px 0; flex-wrap: wrap; }
    .slot { width: 44px; height: 52px; border: 2px solid #30363d; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; background: #0d1117; }
    .slot.active { border-color: #1f6feb; }
    .slot.plus { border-color: #f0b72f; }
    .pad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 10px 0; }
    .pad button { padding: 16px 0; font-size: 18px; font-weight: bold; border-radius: 10px; border: 1px solid #30363d; background: #161b22; color: #e6e6e6; }
    .vwrap { background: #000; border-radius: 10px; overflow: hidden; margin: 8px 0; }
    video { width: 100%; max-height: 30vh; display: block; }
    .prevwrap { background: #000; border-radius: 10px; overflow: hidden; margin: 8px 0; display: none; }
    canvas#prev { width: 100%; display: block; opacity: 0.85; }
    .vctl { display: flex; gap: 6px; margin: 8px 0; flex-wrap: wrap; }
    .vctl button { flex: 1; padding: 12px 4px; border-radius: 8px; border: 1px solid #30363d; background: #161b22; color: #e6e6e6; font-weight: bold; }
    .ts { color: #8b949e; font-size: 12px; text-align: center; }
    .ai { font-size: 12px; background: #1a1333; border: 1px solid #3b2d6e; color: #b8a7f0; padding: 10px; border-radius: 10px; margin: 8px 0; line-height: 1.5; display: none; word-break: break-all; }
    .pbartrack { height: 14px; border-radius: 7px; background: #21262d; overflow: hidden; margin: 8px 0; }
    .pbarfill { height: 100%; width: 0%; background: linear-gradient(90deg,#1f6feb,#3fb950); transition: width 0.3s; }
  </style>
</head>
<body>

  <div id="errbar" class="err"></div>

  <div id="view-lib">
    <h2>🎰 Lotto Collector PRO</h2>
    <div class="card"><div style="font-size:13px;color:#8b949e;">Database: <b id="count">0</b> draws · stored on this phone</div></div>
    <button class="btn green" onclick="show('view-cap')">🎥 Video capture</button>
    <button class="btn orange" onclick="show('view-import'); renderStage();">📋 Review staged draws</button>
    <div class="row">
      <button class="btn gray" onclick="exportJSON()">⬇ JSON</button>
      <button class="btn gray" onclick="exportCSV()">⬇ CSV</button>
    </div>
    <div id="libList"></div>
  </div>

  <div id="view-cap" hidden>
    <h2>🎥 Video Capture</h2>
    <div class="card"><input type="file" id="filepick" accept="video/*" onchange="loadVideo(this)"></div>
    <div class="vwrap"><video id="vid" controls playsinline></video></div>
    <div class="prevwrap"><canvas id="prev"></canvas></div>
    <div class="ts" id="ts">load a video to begin</div>
    <div class="vctl">
      <button onclick="seek(-10)">⏪ 10s</button>
      <button onclick="seek(-1)">◀ 1s</button>
      <button onclick="seek(1)">1s ▶</button>
      <button onclick="seek(10)">10s ⏩</button>
    </div>
    <div class="ai" id="aiinfo"></div>
    <div id="scanprog" hidden>
      <div class="pbartrack"><div class="pbarfill" id="scanbar"></div></div>
      <button class="btn red" id="cancelscan" onclick="scanCancel=true" hidden>✖ Stop scanning</button>
    </div>
    <button class="btn green" id="scanbtn" onclick="autoScanAll()" disabled>⚡ SCAN WHOLE VIDEO (auto-collect till end)</button>
    <button class="btn orange" id="autobtn" onclick="autoRead()" disabled>🧠 AUTO-READ this screen only</button>
    <button class="btn gray" onclick="openSheet()">✍️ Enter manually instead</button>
    <button class="btn gray" onclick="show('view-lib')">← Back to database</button>
  </div>

  <div id="view-sheet" hidden>
    <h2>✍️ Confirm the numbers</h2>
    <div class="card"><div style="font-size:12px;color:#8b949e;" id="sheetinfo"></div></div>
    <div class="card">
      <div class="slots" id="slots"></div>
      <div class="pad" id="pad"></div>
      <div class="row">
        <button class="btn gray" onclick="padBackspace()">⌫ Digit</button>
        <button class="btn gray" onclick="padClear()">Clear all</button>
      </div>
      <div class="hint" style="margin-top:6px;">Leave all 6 PLUS slots empty for old draws that have no Loto Plus.</div>
    </div>
    <button class="btn green" onclick="saveDraw()">💾 Save draw</button>
    <button class="btn red" onclick="show('view-cap')">✖ Cancel</button>
  </div>

  <div id="view-import" hidden>
    <h2>📋 Staged draws</h2>
    <div class="card">
      <textarea id="pastebox" placeholder="Optional: paste copied results here…"></textarea>
      <div class="row">
        <button class="btn green" onclick="parsePaste()">🔍 Parse text</button>
        <button class="btn gray" onclick="document.getElementById('pastebox').value=''">Clear box</button>
      </div>
    </div>
    <div id="stageSummary"></div>
    <div id="stageList"></div>
    <div class="row" id="stageActions" hidden>
      <button class="btn green" onclick="saveStage()">💾 Save all included</button>
      <button class="btn gray" onclick="STAGE=[]; renderStage();">Discard</button>
    </div>
    <button class="btn gray" onclick="show('view-lib')">← Back to database</button>
  </div>

  <script>
    window.onerror = function (msg, src, line) {
      var e = document.getElementById("errbar");
      e.style.display = "block";
      e.textContent = "❌ " + msg + " (line " + line + ")";
    };

    const DB_NAME = "lotto-db", STORE = "draws";
    let slots = [], activeSlot = 0, videoURL = null, capTS = 0;
    let STAGE = [];
    let worker = null, workerReady = false;
    let scanCancel = false;

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => {
          if (!req.result.objectStoreNames.contains(STORE)) req.result.createObjectStore(STORE, { keyPath: "id" });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }
    async function dbAll() {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const req = db.transaction(STORE, "readonly").objectStore(STORE).getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => reject(req.error);
      });
    }
    async function dbPut(rec) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE, "readwrite");
        tx.objectStore(STORE).put(rec);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }
    async function dbDel(id) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE, "readwrite");
        tx.objectStore(STORE).delete(id);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    function show(id) {
      for (const v of ["view-lib", "view-cap", "view-sheet", "view-import"]) document.getElementById(v).hidden = (v !== id);
      window.scrollTo(0, 0);
    }
    function pad2(n) { return String(n).padStart(2, "0"); }
    function fmtT(t) { return pad2(Math.floor(t / 60)) + ":" + pad2(Math.floor(t % 60)); }

    // ================= OCR ENGINE =================
    async function ensureWorker(info) {
      if (workerReady && worker) return worker;
      if (typeof Tesseract === "undefined") {
        info.textContent = "🧠 Loading OCR engine (one-time ~4 MB, cached)…";
        const sources = [
          "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js",
          "https://unpkg.com/tesseract.js@5/dist/tesseract.min.js"
        ];
        for (const src of sources) {
          try {
            await new Promise((res, rej) => {
              const s = document.createElement("script");
              s.src = src;
              s.onload = res;
              s.onerror = () => rej(new Error("cdn fail"));
              document.head.appendChild(s);
            });
            if (typeof Tesseract !== "undefined") break;
          } catch (e) { }
        }
      }
      if (typeof Tesseract === "undefined") throw new Error("OCR engine failed to load — check internet and retry");
      let lastErr = null;
      for (let a = 0; a < 2 && !worker; a++) {
        try {
          info.textContent = "🧠 Starting engine (attempt " + (a + 1) + ")…";
          worker = await Tesseract.createWorker("eng");
        } catch (e) { lastErr = e; worker = null; }
      }
      if (!worker) throw new Error("OCR worker failed: " + (lastErr && lastErr.message ? lastErr.message : "unknown"));
      try { await worker.setParameters({ tessedit_pageseg_mode: "6" }); } catch (e) { }
      workerReady = true;
      return worker;
    }

    function grabFrame(v) {
      const c = document.createElement("canvas");
      const scale = Math.max(1, Math.min(2.2, 1200 / (v.videoWidth || 700)));
      c.width = Math.round((v.videoWidth || 720) * scale);
      c.height = Math.round((v.videoHeight || 1280) * scale);
      const ctx = c.getContext("2d");
      ctx.filter = "grayscale(1) contrast(1.8) brightness(1.08)";
      ctx.drawImage(v, 0, 0, c.width, c.height);
      return c;
    }
    function showPreview(canvas) {
      const p = document.getElementById("prev");
      p.style.display = "block";
      p.width = canvas.width; p.height = canvas.height;
      p.getContext("2d").drawImage(canvas, 0, 0);
    }

    // frame similarity (skip identical screens)
    let lastThumb = null;
    function thumbDiff(canvas) {
      const c = document.createElement("canvas");
      c.width = 24; c.height = 24;
      const ctx = c.getContext("2d");
      ctx.drawImage(canvas, 0, 0, 24, 24);
      const d = ctx.getImageData(0, 0, 24, 24).data;
      const g = [];
      for (let i = 0; i < d.length; i += 4) g.push((d[i] + d[i + 1] + d[i + 2]) / 3);
      if (!lastThumb) { lastThumb = g; return 999; }
      let diff = 0;
      for (let i = 0; i < g.length; i++) diff += Math.abs(g[i] - lastThumb[i]);
      lastThumb = g;
      return diff / g.length;
    }

    function seekedWait(v) {
      return new Promise((res) => {
        let done = false;
        const h = () => { if (!done) { done = true; v.removeEventListener("seeked", h); res(); } };
        v.addEventListener("seeked", h);
        setTimeout(h, 900);
      });
    }

    // row extraction from OCR words
    function extractSixRows(res, canvas) {
      const words = (res.data.words || []).map(x => ({
        t: String(x.text || "").trim(),
        x: x.bbox ? x.bbox.x0 + (x.bbox.x1 - x.bbox.x0) / 2 : 0,
        y: x.bbox ? x.bbox.y0 + (x.bbox.y1 - x.bbox.y0) / 2 : 0
      })).filter(x => x.t);
      const toks = words.filter(x => /^\d{1,2}$/.test(x.t))
        .map(x => ({ v: parseInt(x.t), x: x.x, y: x.y }))
        .filter(t => t.v >= 1 && t.v <= 40);
      toks.sort((a, b) => a.y - b.y);
      const bandH = canvas.height * 0.025;
      const rows = [];
      for (const t of toks) {
        const r = rows.find(r => Math.abs(r.y - t.y) <= bandH);
        if (r) { r.items.push(t); r.y = r.items.reduce((s, x) => s + x.y, 0) / r.items.length; }
        else rows.push({ y: t.y, items: [t] });
      }
      return {
        sixRows: rows.filter(r => r.items.length === 6).sort((a, b) => a.y - b.y),
        words: words
      };
    }

    function stageFromRows(sixRows, words, canvas, stats) {
      const bandH = canvas.height * 0.025;
      for (let i = 0; i < sixRows.length; i++) {
        const r = sixRows[i];
        const nums = r.items.slice().sort((a, b) => a.x - b.x).map(t => t.v);
        const sig = nums.join(",");
        if (stats.sigs.has(sig)) { stats.dup++; continue; }
        const prevY = i > 0 ? sixRows[i - 1].y : r.y - canvas.height * 0.16;
        const band = words.filter(x => x.y < r.y - bandH && x.y > Math.max(prevY, r.y - canvas.height * 0.16))
          .map(x => x.t).join(" ");
        const isPlus = /plus/i.test(band);
        const dts = findDates(band);
        const date = dts.length ? dts[dts.length - 1].iso : "";
        if (isPlus && STAGE.length) {
          const last = STAGE[STAGE.length - 1];
          if (!Array.isArray(last.plus) || last.plus.length === 0) { last.plus = nums; stats.sigs.add(sig); stats.found++; continue; }
        }
        if (date && STAGE.some(s => s.date === date)) { stats.dup++; continue; }
        STAGE.push({ date: date, loto: nums, plus: [], jack1: "", jack2: "", review: !date, include: true });
        stats.sigs.add(sig);
        stats.found++;
      }
    }

    // ================= SINGLE-FRAME READ =================
    async function autoRead() {
      const v = document.getElementById("vid");
      const info = document.getElementById("aiinfo");
      const btn = document.getElementById("autobtn");
      if (!v.src) { alert("Load a video first."); return; }
      v.pause();
      capTS = v.currentTime;
      btn.disabled = true;
      info.style.display = "block";
      try {
        const w = await ensureWorker(info);
        info.textContent = "📸 Grabbing frame…";
        const canvas = grabFrame(v);
        showPreview(canvas);
        info.textContent = "🧠 Reading…";
        const res = await w.recognize(canvas);
        const ex = extractSixRows(res, canvas);
        if (ex.sixRows.length === 0) throw new Error("No complete 6-number row found — pause on a clearer frame and retry");
        const stats = { sigs: new Set(), found: 0, dup: 0 };
        stageFromRows(ex.sixRows, ex.words, canvas, stats);
        renderStage();
        show("view-import");
        document.getElementById("stageSummary").innerHTML =
          '<div class="summary">🧠 Staged <b>' + stats.found + '</b> draw(s)' + (stats.dup ? " · " + stats.dup + " duplicate(s) skipped" : "") + ' · review then Save all</div>';
        info.textContent = "✅ Done.";
      } catch (e) {
        info.textContent = "❌ " + (e.message || e);
      }
      btn.disabled = false;
    }

    // ================= FULL-VIDEO SCAN =================
    async function autoScanAll() {
      const v = document.getElementById("vid");
      const info = document.getElementById("aiinfo");
      const btn = document.getElementById("scanbtn");
      const autob = document.getElementById("autobtn");
      const prog = document.getElementById("scanprog");
      const bar = document.getElementById("scanbar");
      const cancelBtn = document.getElementById("cancelscan");
      if (!v.src) { alert("Load a video first."); return; }
      if (!confirm("Scan the WHOLE video?\n\nKeep the screen on and plugged in.\nYou can press Stop any time — staged draws are kept.")) return;
      scanCancel = false;
      btn.disabled = true; autob.disabled = true; cancelBtn.hidden = false;
      prog.hidden = false;
      info.style.display = "block";
      let wakeLock = null;
      try {
        if (navigator.wakeLock) { try { wakeLock = await navigator.wakeLock.request("screen"); } catch (e) { } }
        const w = await ensureWorker(info);
        const dur = v.duration;
        const step = 1.0;
        v.pause();
        let t = 0;
        let lastDiff = 999;
        const stats = { sigs: new Set(), found: 0, dup: 0 };
        while (t < dur - 0.15 && !scanCancel) {
          v.currentTime = t;
          await seekedWait(v);
          const canvas = grabFrame(v);
          const diff = thumbDiff(canvas);
          const pct = Math.round(100 * t / dur);
          bar.style.width = pct + "%";
          info.textContent = "⚡ Scanning " + pct + "% · found " + stats.found + " draws · at " + fmtT(t) + " / " + fmtT(dur);
          if (diff > 6) {
            const res = await w.recognize(canvas);
            const ex = extractSixRows(res, canvas);
            stageFromRows(ex.sixRows, ex.words, canvas, stats);
          }
          t += step;
        }
        lastThumb = null;
        renderStage();
        show("view-import");
        document.getElementById("stageSummary").innerHTML =
          '<div class="summary">⚡ Scan ' + (scanCancel ? "stopped" : "complete") + ' · staged <b>' + stats.found + '</b> draw(s)' +
          (stats.dup ? " · " + stats.dup + " duplicate(s) skipped" : "") +
          ' · review dates & numbers, then Save all included</div>';
        info.textContent = scanCancel ? "⏹ Stopped — staged draws kept." : "✅ Scan complete — " + stats.found + " draws staged.";
      } catch (e) {
        info.textContent = "❌ " + (e.message || e);
      }
      if (wakeLock) { try { wakeLock.release(); } catch (e) { } }
      btn.disabled = false; autob.disabled = false; cancelBtn.hidden = true;
    }

    // ================= SHEET =================
    function openSheet() {
      slots = []; activeSlot = 0;
      const v = document.getElementById("vid");
      document.getElementById("sheetinfo").textContent = v.src
        ? "Manual entry at video " + fmtT(v.currentTime)
        : "Manual entry";
      renderSlots(); renderPad(); show("view-sheet");
    }
    function renderSlots() {
      let html = "";
      for (let i = 0; i < 6; i++) html += '<div class="slot' + (i === activeSlot ? " active" : "") + '">' + (slots[i] != null ? slots[i] : "") + '</div>';
      for (let i = 6; i < 12; i++) html += '<div class="slot plus' + (i === activeSlot ? " active" : "") + '">' + (slots[i] != null ? slots[i] : "") + '</div>';
      document.getElementById("slots").innerHTML = html;
    }
    function renderPad() {
      let html = "";
      for (let n = 0; n <= 9; n++) html += '<button onclick="padDigit(' + n + ')">' + n + '</button>';
      document.getElementById("pad").innerHTML = html;
    }
    function padDigit(n) {
      if (activeSlot >= 12) return;
      const cur = String(slots[activeSlot] == null ? "" : slots[activeSlot]);
      if (cur.length >= 2) { activeSlot = Math.min(12, activeSlot + 1); return padDigit(n); }
      slots[activeSlot] = Number(cur + String(n));
      if (cur.length + 1 >= 2) activeSlot = Math.min(12, activeSlot + 1);
      renderSlots();
    }
    function padBackspace() {
      const cur = String(slots[activeSlot] == null ? "" : slots[activeSlot]);
      if (cur.length > 0) slots[activeSlot] = Number(cur.slice(0, -1));
      else if (activeSlot > 0) { activeSlot--; slots[activeSlot] = null; }
      renderSlots();
    }
    function padClear() { slots = []; activeSlot = 0; renderSlots(); }

    async function saveDraw() {
      const nums = [];
      for (let i = 0; i < 6; i++) {
        if (slots[i] == null) { alert("Loto slot " + (i + 1) + " is empty."); return; }
        nums.push(slots[i]);
      }
      let plus = null;
      const filled = [];
      for (let i = 6; i < 12; i++) if (slots[i] != null) filled.push(slots[i]);
      if (filled.length > 0 && filled.length < 6) { alert("Loto Plus half-filled — fill all 6, or clear them all for old draws."); return; }
      if (filled.length === 6) plus = filled;
      const seq = Number(localStorage.getItem("lotto-seq") || 0) + 1;
      localStorage.setItem("lotto-seq", String(seq));
      await dbPut({
        id: "d" + Date.now(), seq: seq, numbers: nums, plus: plus,
        videoTs: fmtT(capTS), createdAt: new Date().toISOString()
      });
      slots = []; activeSlot = 0;
      show("view-cap"); renderLib();
    }

    // ================= VIDEO =================
    function loadVideo(input) {
      if (!input.files || !input.files[0]) return;
      if (videoURL) URL.revokeObjectURL(videoURL);
      videoURL = URL.createObjectURL(input.files[0]);
      const v = document.getElementById("vid");
      v.src = videoURL;
      document.getElementById("scanbtn").disabled = false;
      document.getElementById("autobtn").disabled = false;
      document.getElementById("ts").textContent = "video loaded — SCAN WHOLE VIDEO or scrub manually";
    }
    function seek(sec) {
      const v = document.getElementById("vid");
      if (!v.src) return;
      v.pause();
      v.currentTime = Math.max(0, Math.min(v.duration || 0, v.currentTime + sec));
      updTS();
    }
    function updTS() {
      const v = document.getElementById("vid");
      if (!v.src || !v.duration) return;
      document.getElementById("ts").textContent = "at " + fmtT(v.currentTime) + " / " + fmtT(v.duration);
    }
    document.getElementById("vid").addEventListener("timeupdate", updTS);

    // ================= TEXT PARSING =================
    const MONTHS = { jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12 };
    function findDates(text) {
      const found = []; let m;
      const reTxt = /\b(?:(?:mon|tue|wed|thu|fri|sat|sun)[a-z]*,?\s+)?(\d{1,2})(?:st|nd|rd|th)?\s+(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?,?\s+(\d{4})\b/gi;
      while ((m = reTxt.exec(text)) !== null) {
        const d = Number(m[1]), mo = MONTHS[m[2].toLowerCase()], y = Number(m[3]);
        if (mo && d >= 1 && d <= 31) found.push({ idx: m.index, len: m[0].length, iso: y + "-" + String(mo).padStart(2, "0") + "-" + String(d).padStart(2, "0") });
      }
      const reIso = /\b(\d{4})-(\d{2})-(\d{2})\b/g;
      while ((m = reIso.exec(text)) !== null) {
        if (!found.some(f => Math.abs(f.idx - m.index) < 12))
          found.push({ idx: m.index, len: m[0].length, iso: m[1] + "-" + m[2] + "-" + m[3] });
      }
      found.sort((a, b) => a.idx - b.idx);
      const clean = []; let lastEnd = -1;
      for (const f of found) { if (f.idx > lastEnd) { clean.push(f); lastEnd = f.idx + f.len; } }
      return clean;
    }
    function parseBlock(block) {
      const pli = block.search(/loto\s*plus/i);
      let clean = block.replace(/Rs\.?\s*[\d][\d.,]*\s*(millions?|m|bn|billion)?/gi, " ");
      const nums = []; let nm;
      const reN = /\b(\d{1,2})\b/g;
      while ((nm = reN.exec(clean)) !== null) {
        const v = Number(nm[1]);
        if (v >= 1 && v <= 40) nums.push({ v: v, pos: nm.index });
      }
      let loto = [], plus = [], review = false;
      if (pli > -1) {
        loto = nums.filter(n => n.pos < pli).map(n => n.v);
        plus = nums.filter(n => n.pos >= pli).map(n => n.v);
      } else {
        loto = nums.slice(0, 6).map(n => n.v);
        if (nums.length > 6) review = true;
      }
      if (loto.length !== 6) review = true;
      return { loto, plus, jack1: "", jack2: "", review };
    }
    function parsePaste() {
      const text = document.getElementById("pastebox").value;
      if (!text.trim()) { alert("Paste some results first."); return; }
      const dates = findDates(text);
      const parsed = [];
      if (dates.length === 0) {
        const p = parseBlock(text);
        parsed.push({ date: "", loto: p.loto, plus: p.plus, review: true, include: true });
      } else {
        for (let i = 0; i < dates.length; i++) {
          const start = dates[i].idx + dates[i].len;
          const end = (i + 1 < dates.length) ? dates[i + 1].idx : text.length;
          const p = parseBlock(text.slice(start, end));
          parsed.push({ date: dates[i].iso, loto: p.loto, plus: p.plus, review: p.review, include: true });
        }
      }
      let added = 0, skipped = 0;
      for (const p of parsed) {
        if (p.date && STAGE.some(s => s.date === p.date)) { skipped++; continue; }
        STAGE.push(p); added++;
      }
      document.getElementById("pastebox").value = "";
      renderStage();
      document.getElementById("stageSummary").innerHTML = '<div class="summary">Parsed: <b>' + added + '</b> new draw(s)' + (skipped ? " · " + skipped + " duplicate(s) skipped" : "") + '</div>';
    }

    // ================= STAGING =================
    function stageEdit(i, field, idx, val) {
      const v = Number(val);
      STAGE[i][field][idx] = isNaN(v) ? null : v;
      validateCard(i);
    }
    function stageDate(i, val) { STAGE[i].date = val; }
    function stageToggle(i, el) { STAGE[i].include = el.checked; }
    function stageRemove(i) { STAGE.splice(i, 1); renderStage(); }
    function cardValid(s) {
      const ok6 = a => Array.isArray(a) && a.length === 6 && a.every(n => Number.isInteger(n) && n >= 1 && n <= 40) && new Set(a).size === 6;
      const plusOk = !Array.isArray(s.plus) || s.plus.length === 0 || ok6(s.plus);
      return ok6(s.loto) && plusOk;
    }
    function validateCard(i) {
      const cards = document.querySelectorAll("#stageList .draw");
      if (cards[i]) cards[i].classList.toggle("bad", !cardValid(STAGE[i]));
    }
    function renderStage() {
      const box = document.getElementById("stageList");
      const actions = document.getElementById("stageActions");
      document.getElementById("stageSummary").innerHTML = STAGE.length
        ? '<div class="summary">Staging: <b>' + STAGE.length + '</b> draw(s) — fix red cards, untick what you don\'t want, then Save all included.</div>'
        : "";
      actions.hidden = STAGE.length === 0;
      if (STAGE.length === 0) { box.innerHTML = '<div class="empty">Nothing staged yet.<br>Use SCAN WHOLE VIDEO or paste text.</div>'; return; }
      let html = "";
      for (let i = 0; i < STAGE.length; i++) {
        const s = STAGE[i];
        const bad = !cardValid(s);
        const inp = (f, j, v) => '<input class="n" inputmode="numeric" maxlength="2" value="' + (v != null ? v : "") + '" oninput="stageEdit(' + i + ',\'' + f + '\',' + j + ',this.value)">';
        html += '<div class="draw' + (bad ? " bad" : "") + '"><div class="top">' +
          '<input type="checkbox" checked onchange="stageToggle(' + i + ',this)">' +
          '<input class="date" type="date" value="' + (s.date || "") + '" onchange="stageDate(' + i + ',this.value)">' +
          (s.review || bad ? '<span class="badge b-rev">REVIEW</span>' : '<span class="badge b-ok">OK</span>') +
          '<button class="del" onclick="stageRemove(' + i + ')">✕</button></div>' +
          '<div class="numrow"><span class="lbl">LOTO</span>' + s.loto.map((v, j) => inp("loto", j, v)).join("") + '</div>' +
          (Array.isArray(s.plus) && s.plus.length === 6
            ? '<div class="numrow"><span class="lbl">LOTO+</span>' + s.plus.map((v, j) => inp("plus", j, v)).join("") + '</div>'
            : '<div class="numrow"><span class="lbl">LOTO+</span><span class="hint">— none (old format) —</span></div>') +
          '</div>';
      }
      box.innerHTML = html;
    }
    async function saveStage() {
      let saved = 0, bad = 0;
      for (const s of STAGE) {
        if (!s.include) continue;
        if (!cardValid(s) || !s.date) { bad++; continue; }
        const plus = (Array.isArray(s.plus) && s.plus.length === 6) ? s.plus.slice() : null;
        await dbPut({ id: s.date, date: s.date, numbers: s.loto.slice(), plus: plus, createdAt: new Date().toISOString() });
        saved++;
      }
      STAGE = STAGE.filter(s => !(s.include && cardValid(s) && s.date));
      renderStage(); renderLib();
      document.getElementById("stageSummary").innerHTML = '<div class="summary">💾 Saved <b>' + saved + '</b> draw(s)' + (bad ? " · " + bad + " invalid left in staging" : "") + '</div>';
    }

    // ================= LIBRARY / EXPORT =================
    async function renderLib() {
      const list = await dbAll();
      list.sort((a, b) => (a.seq || 0) - (b.seq || 0));
      document.getElementById("count").textContent = list.length;
      const box = document.getElementById("libList");
      if (list.length === 0) {
        box.innerHTML = '<div class="empty">No draws yet.<br>Use SCAN WHOLE VIDEO.</div>';
        return;
      }
      let html = "";
      for (const r of list) {
        html += '<div class="draw"><div style="flex:1;">' +
          '<div class="hint" style="color:#f0b72f;font-weight:bold;">Draw #' + (r.seq || "?") + (r.videoTs ? " · 🎥 " + r.videoTs : "") + '</div>' +
          '<div style="font-size:14px;font-weight:bold;">LOTO: ' + r.numbers.join(" · ") + '</div>' +
          (r.plus ? '<div style="font-size:14px;font-weight:bold;color:#f0b72f;">PLUS: ' + r.plus.join(" · ") + '</div>' : '') +
          '</div><button class="del" onclick="delDraw(\'' + r.id + '\')">✕</button></div>';
      }
      box.innerHTML = html;
    }
    async function delDraw(id) {
      if (!confirm("Delete this draw?")) return;
      await dbDel(id); renderLib();
    }
    function download(name, content, type) {
      const blob = new Blob([content], { type: type });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = name; a.click();
    }
    async function exportJSON() {
      const list = await dbAll();
      download("loto-database.json", JSON.stringify(list, null, 2), "application/json");
    }
    async function exportCSV() {
      const list = await dbAll();
      let csv = "draw,l1,l2,l3,l4,l5,l6,p1,p2,p3,p4,p5,p6,videoTs\n";
      for (const r of list) {
        const l = []; for (let i = 0; i < 6; i++) l.push(r.numbers[i] != null ? r.numbers[i] : "");
        const p = []; for (let i = 0; i < 6; i++) p.push(r.plus && r.plus[i] != null ? r.plus[i] : "");
        csv += [r.seq || ""].concat(l, p, ['"' + (r.videoTs || "") + '"']).join(",") + "\n";
      }
      download("loto-database.csv", csv, "text/csv");
    }

    renderLib();
  </script>
</body>
</html>
