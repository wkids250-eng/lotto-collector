<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lotto Collector</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; background: #0d1117; color: #e6e6e6; padding: 12px; margin: 0; }
    h2 { margin: 4px 0 10px; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 12px; margin: 8px 0; }
    .btn { display: block; width: 100%; padding: 14px; margin: 8px 0; border-radius: 10px; border: none; font-size: 16px; font-weight: bold; background: #1f6feb; color: #fff; }
    .btn.green { background: #238636; }
    .btn.red { background: #b62324; }
    .btn.gray { background: #30363d; }
    .row { display: flex; gap: 8px; }
    .row .btn { flex: 1; }
    .draw { display: flex; align-items: center; gap: 8px; background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 10px 12px; margin: 6px 0; }
    .draw .d { flex: 1; }
    .draw .date { color: #58a6ff; font-weight: bold; font-size: 13px; }
    .draw .nums { font-size: 16px; font-weight: bold; letter-spacing: 1px; }
    .del { background: #b62324; border: none; color: #fff; border-radius: 8px; padding: 8px 12px; font-weight: bold; }
    input[type=date] { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #30363d; background: #0d1117; color: #e6e6e6; font-size: 16px; }
    .slots { display: flex; gap: 6px; justify-content: center; margin: 10px 0; flex-wrap: wrap; }
    .slot { width: 46px; height: 54px; border: 2px solid #30363d; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: bold; background: #0d1117; }
    .slot.active { border-color: #1f6feb; }
    .slot.bonusSlot { border-color: #f0b72f; }
    .pad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 10px 0; }
    .pad button { padding: 16px 0; font-size: 18px; font-weight: bold; border-radius: 10px; border: 1px solid #30363d; background: #161b22; color: #e6e6e6; }
    .pad button:active { background: #1f6feb; }
    .vwrap { background: #000; border-radius: 10px; overflow: hidden; margin: 8px 0; }
    video { width: 100%; max-height: 40vh; display: block; }
    .vctl { display: flex; gap: 6px; margin: 8px 0; flex-wrap: wrap; }
    .vctl button { flex: 1; padding: 12px 4px; border-radius: 8px; border: 1px solid #30363d; background: #161b22; color: #e6e6e6; font-weight: bold; }
    .ts { color: #8b949e; font-size: 12px; text-align: center; }
    .err { background: #2d1214; color: #f85149; border: 1px solid #5c2320; padding: 10px; border-radius: 10px; margin: 8px 0; font-size: 12px; word-break: break-all; display: none; }
    .empty { text-align: center; color: #8b949e; padding: 30px 10px; }
    label { font-size: 13px; color: #8b949e; }
  </style>
</head>
<body>

  <div id="errbar" class="err"></div>

  <!-- LIBRARY -->
  <div id="view-lib">
    <h2>🎰 Lotto Collector</h2>
    <div class="card">
      <div style="font-size:13px;color:#8b949e;">Database: <b id="count">0</b> draws saved · stored on this phone</div>
    </div>
    <button class="btn green" onclick="startCapture()">▶ Capture from video</button>
    <div class="row">
      <button class="btn gray" onclick="exportJSON()">⬇ JSON</button>
      <button class="btn gray" onclick="exportCSV()">⬇ CSV</button>
    </div>
    <div class="card">
      <b>⚙ Draw format:</b>
      <div class="row" style="margin-top:6px;">
        <button class="btn gray" id="set6" onclick="setCount(6)">6 + bonus</button>
        <button class="btn gray" id="set5" onclick="setCount(5)">5 + bonus</button>
        <button class="btn gray" id="set5n" onclick="setCount(5,false)">5 no bonus</button>
        <button class="btn gray" id="set6n" onclick="setCount(6,false)">6 no bonus</button>
      </div>
    </div>
    <div id="libList"></div>
  </div>

  <!-- CAPTURE -->
  <div id="view-cap" hidden>
    <h2>🎥 Video Capture</h2>
    <div class="card">
      <input type="file" id="filepick" accept="video/*" onchange="loadVideo(this)">
    </div>
    <div class="vwrap"><video id="vid" controls playsinline></video></div>
    <div class="ts" id="ts">load a video to begin</div>
    <div class="vctl">
      <button onclick="seek(-10)">⏪ 10s</button>
      <button onclick="seek(-1)">◀ 1s</button>
      <button onclick="seek(-0.2)">◀ frame</button>
      <button onclick="seek(0.2)">frame ▶</button>
      <button onclick="seek(1)">1s ▶</button>
      <button onclick="seek(10)">10s ⏩</button>
    </div>
    <button class="btn green" id="capbtn" onclick="openSheet()" disabled>🎯 CAPTURE THIS DRAW</button>
    <button class="btn gray" onclick="show('view-lib')">← Back to database</button>
  </div>

  <!-- NUMBER SHEET -->
  <div id="view-sheet" hidden>
    <h2>✍️ Enter the drawn numbers</h2>
    <div class="card">
      <label>Draw date</label>
      <input type="date" id="drawdate">
    </div>
    <div class="card">
      <div class="slots" id="slots"></div>
      <div class="pad" id="pad"></div>
      <div class="row">
        <button class="btn gray" onclick="padBackspace()">⌫ Digit</button>
        <button class="btn gray" onclick="padClear()">Clear all</button>
      </div>
    </div>
    <button class="btn green" onclick="saveDraw()">💾 Save draw</button>
    <button class="btn red" onclick="show('view-cap')">✖ Cancel</button>
  </div>

  <script>
    window.onerror = function (msg, src, line) {
      var e = document.getElementById("errbar");
      e.style.display = "block";
      e.textContent = "❌ " + msg + " (line " + line + ")";
    };

    const DB_NAME = "lotto-db", STORE = "draws";
    let SETTINGS = { count: 6, bonus: true };
    let slots = [], activeSlot = 0;
    let videoURL = null, capTS = 0;

    try {
      const s = JSON.parse(localStorage.getItem("lotto-settings"));
      if (s && s.count) SETTINGS = s;
    } catch (e) {}

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => {
          if (!req.result.objectStoreNames.contains(STORE)) req.result.createObjectStore(STORE, { keyPath: "id" });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }
    async function dbAll() {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const req = db.transaction(STORE, "readonly").objectStore(STORE).getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => reject(req.error);
      });
    }
    async function dbPut(rec) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE, "readwrite");
        tx.objectStore(STORE).put(rec);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }
    async function dbDel(id) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE, "readwrite");
        tx.objectStore(STORE).delete(id);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    function show(id) {
      for (const v of ["view-lib", "view-cap", "view-sheet"]) document.getElementById(v).hidden = (v !== id);
      window.scrollTo(0, 0);
    }

    function setCount(n, bonus) {
      SETTINGS = { count: n, bonus: bonus === false ? false : true };
      localStorage.setItem("lotto-settings", JSON.stringify(SETTINGS));
      highlightSet();
    }
    function highlightSet() {
      document.getElementById("set6").style.background = (SETTINGS.count === 6 && SETTINGS.bonus) ? "#1f6feb" : "#30363d";
      document.getElementById("set5").style.background = (SETTINGS.count === 5 && SETTINGS.bonus) ? "#1f6feb" : "#30363d";
      document.getElementById("set5n").style.background = (SETTINGS.count === 5 && !SETTINGS.bonus) ? "#1f6feb" : "#30363d";
      document.getElementById("set6n").style.background = (SETTINGS.count === 6 && !SETTINGS.bonus) ? "#1f6feb" : "#30363d";
    }

    function fmtNums(r) {
      return r.numbers.join(" · ") + (r.bonus != null ? "  ★" + r.bonus : "");
    }
    function pad2(n) { return String(n).padStart(2, "0"); }

    async function renderLib() {
      const list = await dbAll();
      list.sort((a, b) => (b.date + b.id).localeCompare(a.date + a.id));
      document.getElementById("count").textContent = list.length;
      const box = document.getElementById("libList");
      if (list.length === 0) {
        box.innerHTML = '<div class="empty">No draws yet.<br>Capture your first one from a video.</div>';
        return;
      }
      let html = "";
      for (const r of list) {
        html += '<div class="draw"><div class="d"><div class="date">' + r.date +
          (r.videoTs ? " · 🎥 " + r.videoTs : "") + '</div><div class="nums">' + fmtNums(r) + '</div></div>' +
          '<button class="del" onclick="delDraw(\'' + r.id + '\')">✕</button></div>';
      }
      box.innerHTML = html;
    }

    async function delDraw(id) {
      if (!confirm("Delete this draw?")) return;
      await dbDel(id);
      renderLib();
    }

    function startCapture() { show("view-cap"); }

    function loadVideo(input) {
      if (!input.files || !input.files[0]) return;
      if (videoURL) URL.revokeObjectURL(videoURL);
      videoURL = URL.createObjectURL(input.files[0]);
      const v = document.getElementById("vid");
      v.src = videoURL;
      document.getElementById("capbtn").disabled = false;
      document.getElementById("ts").textContent = "video loaded — scrub to a result, then CAPTURE";
    }
    function seek(sec) {
      const v = document.getElementById("vid");
      if (!v.src) return;
      v.pause();
      v.currentTime = Math.max(0, Math.min(v.duration || 0, v.currentTime + sec));
      updTS();
    }
    function updTS() {
      const v = document.getElementById("vid");
      if (!v.src || !v.duration) return;
      const t = v.currentTime;
      document.getElementById("ts").textContent = "at " + pad2(Math.floor(t / 60)) + ":" + pad2(Math.floor(t % 60));
    }
    document.getElementById("vid").addEventListener("timeupdate", updTS);

    function openSheet() {
      const v = document.getElementById("vid");
      if (!v.src) return;
      v.pause();
      capTS = v.currentTime;
      slots = [];
      activeSlot = 0;
      document.getElementById("drawdate").value = new Date().toISOString().slice(0, 10);
      renderSlots();
      renderPad();
      show("view-sheet");
    }

    function renderSlots() {
      let html = "";
      for (let i = 0; i < SETTINGS.count; i++) {
        html += '<div class="slot' + (i === activeSlot ? " active" : "") + '">' + (slots[i] != null ? slots[i] : "") + '</div>';
      }
      if (SETTINGS.bonus) {
        html += '<div class="slot bonusSlot' + (activeSlot === SETTINGS.count ? " active" : "") + '">' + (slots[SETTINGS.count] != null ? slots[SETTINGS.count] : "") + '</div>';
      }
      document.getElementById("slots").innerHTML = html;
    }
    function renderPad() {
      let html = "";
      for (let n = 0; n <= 9; n++) html += '<button onclick="padDigit(' + n + ')">' + n + '</button>';
      document.getElementById("pad").innerHTML = html;
    }
    function padDigit(n) {
      const max = SETTINGS.count + (SETTINGS.bonus ? 1 : 0);
      if (activeSlot >= max) return;
      const cur = String(slots[activeSlot] == null ? "" : slots[activeSlot]);
      if (cur.length >= 2) { activeSlot++; return padDigit(n); }
      slots[activeSlot] = Number(cur + String(n));
      if (cur.length + 1 >= 2) activeSlot++;
      renderSlots();
    }
    function padBackspace() {
      const cur = String(slots[activeSlot] == null ? "" : slots[activeSlot]);
      if (cur.length > 0) {
        slots[activeSlot] = Number(cur.slice(0, -1));
      } else if (activeSlot > 0) {
        activeSlot--;
        slots[activeSlot] = null;
      }
      renderSlots();
    }
    function padClear() { slots = []; activeSlot = 0; renderSlots(); }

    async function saveDraw() {
      const date = document.getElementById("drawdate").value;
      if (!date) { alert("Choose the draw date first."); return; }
      const nums = [];
      for (let i = 0; i < SETTINGS.count; i++) {
        if (slots[i] == null) { alert("Fill all " + SETTINGS.count + " numbers."); return; }
        nums.push(slots[i]);
      }
      let bonus = null;
      if (SETTINGS.bonus) {
        if (slots[SETTINGS.count] == null) { alert("Fill the bonus number (yellow slot)."); return; }
        bonus = slots[SETTINGS.count];
      }
      const v = document.getElementById("vid");
      const rec = {
        id: "d" + Date.now(),
        date: date,
        numbers: nums,
        bonus: bonus,
        videoTs: pad2(Math.floor(capTS / 60)) + ":" + pad2(Math.floor(capTS % 60)),
        createdAt: new Date().toISOString()
      };
      await dbPut(rec);
      slots = [];
      activeSlot = 0;
      show("view-lib");
      renderLib();
    }

    function download(name, content, type) {
      const blob = new Blob([content], { type: type });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = name;
      a.click();
    }
    async function exportJSON() {
      const list = await dbAll();
      list.sort((a, b) => a.date.localeCompare(b.date));
      download("lotto-database.json", JSON.stringify(list, null, 2), "application/json");
    }
    async function exportCSV() {
      const list = await dbAll();
      list.sort((a, b) => a.date.localeCompare(b.date));
      const max = Math.max(6, ...list.map(r => r.numbers.length));
      let csv = "date," + Array.from({ length: max }, (_, i) => "n" + (i + 1)).join(",") + ",bonus,videoTs\n";
      for (const r of list) {
        const row = [r.date];
        for (let i = 0; i < max; i++) row.push(r.numbers[i] != null ? r.numbers[i] : "");
        row.push(r.bonus != null ? r.bonus : "");
        row.push('"' + (r.videoTs || "") + '"');
        csv += row.join(",") + "\n";
      }
      download("lotto-database.csv", csv, "text/csv");
    }

    highlightSet();
    renderLib();
  </script>
</body>
</html>
